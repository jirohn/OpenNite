<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc35c"/>
      <stop offset="0.5" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#f05a17"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#e8f6f7"/>
      <stop offset="0.45" stop-color="#9fb7bd"/>
      <stop offset="1" stop-color="#5b717a"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c4a54"/>
      <stop offset="1" stop-color="#1c252d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)" stroke="#2c3644" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>

  <!-- Letra O: anillo grueso con el hueco en el centro -->
  <circle cx="206" cy="256" r="118" fill="none" stroke="url(#orange)" stroke-width="82" filter="url(#glow)"/>
  <circle cx="206" cy="256" r="118" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Revólver saliendo del hueco hacia la derecha -->
  <g transform="rotate(-13 290 245)">
    <!-- cañón -->
    <path d="M272 218 L428 218 L444 226 L444 252 L428 260 L272 260 Z" fill="url(#steel)" stroke="#26323a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="330" y="220" width="96" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <!-- compensador / boca -->
    <rect x="434" y="212" width="24" height="54" rx="7" fill="#2e3b44" stroke="#172129" stroke-width="4"/>
    <circle cx="446" cy="239" r="9" fill="#0b0e14"/>
    <!-- cilindro -->
    <rect x="244" y="208" width="66" height="70" rx="15" fill="url(#steel)" stroke="#26323a" stroke-width="5"/>
    <circle cx="277" cy="243" r="18" fill="#3d4c55" stroke="#1c262d" stroke-width="4"/>
    <circle cx="277" cy="243" r="6" fill="#aac2c8"/>
    <!-- cuerpo / armazón -->
    <path d="M250 262 L316 262 L326 292 L286 310 L246 296 Z" fill="url(#steel)" stroke="#26323a" stroke-width="5" stroke-linejoin="round"/>
    <!-- guardamonte -->
    <path d="M292 288 Q330 314 300 340" fill="none" stroke="#2b3942" stroke-width="9" stroke-linecap="round"/>
    <!-- empuñadura metida dentro del hueco de la O -->
    <path d="M272 302 L320 318 L292 402 Q280 424 258 414 L236 402 Z" fill="url(#grip)" stroke="#131b22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M266 330 L300 342 M260 356 L292 368" stroke="#63757e" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- martillo -->
    <path d="M248 212 L236 190 L256 194 L262 214 Z" fill="#46565f" stroke="#1c262d" stroke-width="4"/>
  </g>

  <!-- Destello de boca -->
  <g fill="#ffd166" opacity="0.95">
    <path d="M468 210 L492 197 L480 222 L506 228 L478 236 L490 260 L466 246 L458 268 L452 240 L428 236 L452 228 L446 204 Z"/>
  </g>
  <circle cx="468" cy="230" r="12" fill="#fff4c2" opacity="0.9"/>
</svg>
