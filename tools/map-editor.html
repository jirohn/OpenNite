<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OpenNite — Editor de mapa (San Borondón)</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; color: #e6e8ee; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden; }
  canvas#map-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 12px; top: 12px; width: 260px; height: 100vh; overflow-y: auto; background: rgba(12, 16, 24, .95); border: 1px solid #27303f; border-radius: 8px; backdrop-filter: blur(3px); padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .panel h2 { margin: 0 0 2px; font-size: 16px; }
  .tag { display: inline-block; font-size: 10px; background: #3b4b6a; color: #c4d1e6; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
  h3 { font-size: 12px; color: #8d9bb0; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  button { background: #213046; color: #e8eef6; border: 1px solid #34435c; padding: 7px 10px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; margin: 4px 0; }
  button.primary { background: #22478b; border-color: #2b5cb8; font-weight: 600; }
  button.ghost { background: transparent; border: none; color: #9db0c7; font-size: 11px; padding: 2px 6px; width: auto; margin: 0; }
  button.active { background: #2b5cb8; border-color: #4a8cff; }
  select { width: 100%; background: #0f141b; border: 1px solid #27303f; color: #e6e8ee; padding: 7px 9px; border-radius: 6px; margin: 6px 0; }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 0; }
  .palette button { font-size: 10px; padding: 6px 4px; }
  .hint { font-size: 10px; color: #7c8897; line-height: 1.5; }
  .back { position: fixed; left: 12px; bottom: 10px; font-size: 11px; color: #7a8499; z-index: 2; }
  .back a { color: #9db3d5; text-decoration: none; }
  #error-overlay { display:none; position:fixed; left:12px; top:12px; z-index:9; background:#3a1414; border:1px solid #7a3030; color:#ffdada; padding:12px 14px; border-radius:8px; font:12px Consolas,monospace; max-width:60vw; white-space:pre-wrap; }
</style>
</head>
<body>
<canvas id="map-canvas"></canvas>
<div class="panel">
  <h2>Editor de mapa <span class="tag">San Borondón</span></h2>
  <small class="hint">Clic en el terreno para colocar la pieza seleccionada. Clic derecho para borrar. Arrastra para orbitar. Rueda para zoom.</small>

  <h3>Paleta</h3>
  <div class="palette">
    <button data-piece="house" class="active">Casa</button>
    <button data-piece="cabin">Cabaña</button>
    <button data-piece="tower">Torre</button>
    <button data-piece="container">Contenedor</button>
    <button data-piece="wall">Muro (kit)</button>
    <button data-piece="road">Camino</button>
    <button data-piece="tree">Árbol</button>
    <button data-piece="rock">Roca</button>
  </div>

  <h3>Rotación</h3>
  <select id="rotSelect">
    <option value="0">0°</option>
    <option value="1.5708">90°</option>
    <option value="3.1416">180°</option>
    <option value="4.7124">270°</option>
  </select>

  <h3>Plantas (casa/cabaña)</h3>
  <select id="floorsSelect">
    <option value="1">1 planta</option>
    <option value="2">2 plantas</option>
    <option value="3">3 plantas</option>
  </select>

  <div class="row" style="margin-top:12px">
    <button class="primary" id="saveMap">Guardar mapa</button>
  </div>
  <div class="row">
    <button class="ghost" id="clearMap">Limpiar todo</button>
  </div>
  <textarea id="mapText" readonly style="height:80px"></textarea>
  <small class="hint" id="status">Listo. Coloca piezas con clic izquierdo.</small>
</div>
<div class="back"><a href="/">← Volver al juego</a></div>
<div id="error-overlay"></div>
<script type="module" src="./map-editor.mjs"></script>
</body>
</html>
